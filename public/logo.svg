<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Outer Glow -->
    <radialGradient id="outerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0088cc" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#005588" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#001830" stop-opacity="0"/>
    </radialGradient>

    <!-- Shield Gold/Champagne Metallic Bezel -->
    <linearGradient id="shieldGoldBezel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDF4DC"/>
      <stop offset="25%" stop-color="#E2CA9D"/>
      <stop offset="50%" stop-color="#B28C57"/>
      <stop offset="75%" stop-color="#D9BF8F"/>
      <stop offset="100%" stop-color="#886438"/>
    </linearGradient>

    <!-- Shield Outer Dark Border -->
    <linearGradient id="shieldDarkBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6d542e"/>
      <stop offset="100%" stop-color="#2a1f10"/>
    </linearGradient>

    <!-- Inner Shield Metallic Blue -->
    <linearGradient id="innerShieldBg" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2580c3"/>
      <stop offset="35%" stop-color="#144d7a"/>
      <stop offset="70%" stop-color="#0b2c49"/>
      <stop offset="100%" stop-color="#061628"/>
    </linearGradient>

    <!-- Inner Shield Bevel Accent -->
    <linearGradient id="innerShieldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#69c0ff" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#1872b2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#002b4d" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Paper Plane Main Left Wing -->
    <linearGradient id="planeLeftWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5f3fc"/>
      <stop offset="30%" stop-color="#38bdf8"/>
      <stop offset="75%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>

    <!-- Paper Plane Right Wing (Gold-lit Edge) -->
    <linearGradient id="planeRightWing" x1="20%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fffbeb"/>
      <stop offset="35%" stop-color="#fde68a"/>
      <stop offset="65%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#92400e"/>
    </linearGradient>

    <!-- Paper Plane Keel / Bottom Fold -->
    <linearGradient id="planeFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#082f49"/>
    </linearGradient>

    <!-- Neon Plane Glow Filter -->
    <filter id="planeGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <!-- Shield Shadow -->
    <filter id="shieldShadow" x="-20%" y="-15%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="16" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#005588" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ambient Glow Behind Shield -->
  <circle cx="256" cy="245" r="230" fill="url(#outerGlow)"/>

  <!-- Shield Outer Group with Shadow -->
  <g filter="url(#shieldShadow)">
    <!-- Gold Metallic Outer Shield -->
    <path d="M 256 62
             C 320 86, 380 94, 404 102
             C 410 162, 412 245, 382 328
             C 356 400, 304 445, 256 468
             C 208 445, 156 400, 130 328
             C 100 245, 102 162, 108 102
             C 132 94, 192 86, 256 62 Z"
          fill="url(#shieldGoldBezel)"
          stroke="url(#shieldDarkBorder)"
          stroke-width="3"/>

    <!-- Gold Bezel Inner Highlight -->
    <path d="M 256 75
             C 314 96, 368 104, 390 111
             C 395 166, 397 240, 370 317
             C 346 384, 298 426, 256 448
             C 214 426, 166 384, 142 317
             C 115 240, 117 166, 122 111
             C 144 104, 198 96, 256 75 Z"
          fill="none"
          stroke="#fff7ed"
          stroke-width="1.8"
          stroke-opacity="0.6"/>

    <!-- Inner Shield (Deep Sapphire Blue with Rim) -->
    <path d="M 256 94
             C 304 112, 350 119, 368 125
             C 372 172, 374 236, 351 303
             C 330 361, 290 398, 256 418
             C 222 398, 182 361, 161 303
             C 138 236, 140 172, 144 125
             C 162 119, 208 112, 256 94 Z"
          fill="url(#innerShieldBg)"
          stroke="url(#innerShieldRim)"
          stroke-width="4"/>

    <!-- Inner Glow Gradient Arc -->
    <path d="M 256 100
             C 298 116, 340 123, 356 128
             C 358 148, 358 180, 354 212
             C 310 180, 202 180, 158 212
             C 154 180, 154 148, 156 128
             C 172 123, 214 116, 256 100 Z"
          fill="#38bdf8"
          fill-opacity="0.18"/>
  </g>

  <!-- Glowing Telegram Pro 3D Origami Airplane -->
  <g filter="url(#planeGlow)">
    <!-- Right Golden-Wing Blade (Sunlit facet) -->
    <path d="M 296 172
             L 252 284
             L 334 266
             Z"
          fill="url(#planeRightWing)"/>

    <!-- Left Cyan/Neon-Wing Blade (Glow facet) -->
    <path d="M 296 172
             L 174 246
             L 252 284
             Z"
          fill="url(#planeLeftWing)"/>

    <!-- Bottom Keel / Underbody Fold -->
    <path d="M 252 284
             L 242 320
             L 268 296
             Z"
          fill="url(#planeFold)"/>

    <!-- Center Fold Highlight Ridge Line -->
    <path d="M 296 172
             L 252 284"
          stroke="#ffffff"
          stroke-width="2.5"
          stroke-linecap="round"/>

    <!-- Wing Tip Bevel Highlighting -->
    <path d="M 174 246
             L 296 172
             L 334 266"
          fill="none"
          stroke="#e0f2fe"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-opacity="0.9"/>
  </g>

  <!-- Sparkles / Micro Stars -->
  <circle cx="168" cy="190" r="2" fill="#7dd3fc" opacity="0.8"/>
  <circle cx="348" cy="318" r="1.5" fill="#fde68a" opacity="0.75"/>
  <circle cx="236" cy="336" r="2" fill="#38bdf8" opacity="0.9"/>
  <circle cx="330" cy="160" r="1.5" fill="#ffffff" opacity="0.85"/>
</svg>
